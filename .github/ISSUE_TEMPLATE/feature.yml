name: Feature request
description: Propose a focused improvement
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or designer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require secrets in frontend code.
          required: true
        - label: This does not copy protected code or artwork.
          required: true
