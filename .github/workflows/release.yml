name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate tag and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, accessSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.TAG_NAME !== 'v' + version) throw new Error('Tag does not match package version');
          accessSync('docs/releases/v' + version + '.md');
          JS

      - name: Install locked dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Publish installation archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="dist/interless-twitch-chat-${TAG_NAME}.zip"
          notes="docs/releases/${TAG_NAME}.md"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Interless Chat ${TAG_NAME}" --notes-file "$notes"
            gh release upload "$TAG_NAME" "$archive" "${archive}.sha256" --clobber
          else
            gh release create "$TAG_NAME" "$archive" "${archive}.sha256" \
              --verify-tag --title "Interless Chat ${TAG_NAME}" --notes-file "$notes"
          fi
